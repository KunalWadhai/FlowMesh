version: '3.9'

name: flowmesh

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: flowmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowmesh
      POSTGRES_PASSWORD: flowmesh
      POSTGRES_DB: flowmesh
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowmesh']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: flowmesh-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: flowmesh-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://flowmesh:flowmesh@postgres:5432/flowmesh?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-at-least-32-chars}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      WORKER_CONCURRENCY: 10
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Web (production build) ──────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: flowmesh-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: http://api:3001/api
      VITE_WS_URL: http://api:3001
    ports:
      - '3000:80'

  # ─── BullMQ Dashboard (dev only) ────────────────────────────────────────────
  bull-board:
    image: deadly0/bull-board
    container_name: flowmesh-bull-board
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '3002:3000'
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: flowmesh-network
