# Render Blueprint for FlowMesh
# This file configures automatic deployment of services on Render
# See: https://render.com/docs/blueprint-spec

services:
  # PostgreSQL Database
  - type: pserv
    name: flowmesh-postgres
    plan: free
    databaseName: flowmesh
    databaseUser: flowmesh
    region: oregon
    ipAllowList: []

  # Redis Instance
  - type: redis
    name: flowmesh-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # Backend API
  - type: web
    name: flowmesh-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build --workspace=apps/api
    startCommand: cd apps/api && npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: flowmesh-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: flowmesh-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 100
      - key: WORKER_CONCURRENCY
        value: 3
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
      # Add OPENAI_API_KEY manually in Render dashboard if needed
    healthCheckPath: /health
